<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Webcam frame — J England</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    html, body { width: 100%; height: 100%; background: transparent; }
    .frame {
      position: absolute;
      inset: 0;
    }
    .frame span {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 3px solid var(--cyan);
    }
    .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
    .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
    .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
    .br { bottom: 0; right: 0; border-left: 0; border-top: 0; }
  </style>
</head>
<body>
  <div class="frame">
    <span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span>
  </div>
</body>
</html>
