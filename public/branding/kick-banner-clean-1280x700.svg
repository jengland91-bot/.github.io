<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-label="J England Kick banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="50%" stop-color="#0e1514"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00f2fe"/>
      <stop offset="65%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="42%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="62%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="700" fill="url(#bg)"/>
  <rect width="1280" height="700" fill="url(#glowCyan)"/>
  <rect width="1280" height="700" fill="url(#glowGreen)"/>
  <text x="640" y="320" text-anchor="middle" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="10">J ENGLAND</text>
  <rect x="460" y="352" width="360" height="3" fill="url(#accent)"/>
  <text x="640" y="410" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="5">SIM RACING  |  GAMES  |  IRL</text>
