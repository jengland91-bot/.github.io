<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dual Cam — Rise Above</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/theme.css" />
</head>
<body class="scene-dual">
  <div class="ticks"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>

  <header class="top-bar">
    <div class="live-pill"><i></i> <span data-dual-title>DUAL</span></div>
    <div class="brand"><small data-handle></small><span data-brand></span></div>
    <div class="spacer"></div>
    <div class="clock" data-clock></div>
  </header>

  <div class="well well-labels" data-slot="labels"><span class="well-tag">Lumia event list  420×70</span></div>
  <div class="well well-alerts" data-slot="alerts"><span class="well-tag">Lumia alerts  860×200</span></div>
  <div class="well well-angle" data-slot="angle">
    <span class="well-tag">Game / Angle 2  640×360</span>
    <span class="cam-name">ANGLE 2</span>
  </div>
  <div class="well well-face" data-slot="face">
    <span class="well-tag">Cam / Face  240x135</span>
    <span class="cam-name">FACE</span>
  </div>
  <div class="well well-room" data-slot="room">
    <span class="well-tag">Cam / Room  240x135</span>
    <span class="cam-name">ROOM</span>
  </div>
  <div class="well well-wheel" data-slot="wheel">
    <span class="well-tag">Cam / Wheel  240x135</span>
    <span class="cam-name">WHEEL</span>
  </div>
  <div class="well well-pedals" data-slot="pedals">
    <span class="well-tag">Cam / Pedals  240x135</span>
    <span class="cam-name">PEDALS</span>
  </div>
  <div class="well well-chat" data-slot="chat"><span class="well-tag">Social Stream Ninja  640×580</span></div>
  <div class="well well-goal" data-slot="goal"><span class="well-tag">Lumia goal  400×48</span></div>

  <script src="shared/config.js"></script>
  <script src="shared/overlay.js"></script>
</body>
</html>
