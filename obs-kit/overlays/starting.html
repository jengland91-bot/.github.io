<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Starting Soon — J England</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/theme.css" />
</head>
<body class="scene-starting" data-scene="starting">
  <img class="backdrop-photo" alt="" />
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <canvas id="dust"></canvas>
  <div class="ticks"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
  <header class="top-bar">
    <div class="live-pill"><i></i> <span data-staging-pill>STAGING</span></div>
    <div class="brand"><strong data-brand>J ENGLAND</strong><small data-handle>@jengland91</small></div>
    <div class="spacer"></div>
    <div class="clock" data-clock></div>
  </header>
  <section class="scene-title">
    <div class="mono">JE</div>
    <div class="kicker" data-starting-kicker>GOING LIVE</div>
    <h1><span data-starting-line1>STARTING</span><br /><span data-starting-line2>SOON</span></h1>
    <div class="game-now" data-game></div>
    <p data-tagline></p>
    <div class="count-wrap">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="52" />
        <circle class="ring" data-ring cx="60" cy="60" r="52" />
      </svg>
      <div class="countdown" data-countdown>05:00</div>
    </div>
  </section>
  <div class="social-row" data-socials></div>
  <script src="shared/config.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/overlay.js"></script>
</body>
</html>
