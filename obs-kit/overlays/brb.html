<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BRB — J England</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/theme.css" />
</head>
<body class="scene-brb" data-scene="brb">
  <img class="backdrop-photo" alt="" />
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <canvas id="dust"></canvas>
  <div class="ticks"><span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span></div>
  <header class="top-bar">
    <div class="live-pill"><i></i> <span data-hold-pill>BRB</span></div>
    <div class="brand"><strong data-brand>J ENGLAND</strong><small data-handle>@jengland91</small></div>
    <div class="spacer"></div>
    <div class="clock" data-clock></div>
  </header>
  <section class="scene-title">
    <div class="kicker" data-brb-kicker>HOLDING</div>
    <h1><span data-brb-line1>BE RIGHT</span><br /><span data-brb-line2>BACK</span></h1>
    <p data-brb></p>
  </section>
  <div class="social-row" data-socials></div>
  <script src="shared/config.js"></script>
  <script src="shared/layout.js"></script>
  <script src="shared/overlay.js"></script>
</body>
</html>
