<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --text-color: #ffffff;
            --accent-color: #ff4500; /* Change to your brand color */
            --button-bg: #1a1a1a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            object-fit: cover;
        }

        .profile h1 {
            font-size: 1.5rem;
            margin: 10px 0 5px 0;
        }

        .profile p {
            color: #888;
            margin: 0;
            font-size: 0.9rem;
        }

        .links-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background-color: var(--button-bg);
            color: var(--text-color);
            text-decoration: none;
            padding: 16px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
        }

        /* Hover animation effect */
        .link-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
            background-color: #222;
        }
    </style>
</head>
<body>

    <div class="profile">
        <img src="your-avatar.jpg" alt="Profile Picture">
        <h1>Your Name</h1>
        <p>Photographer & Creator</p>
    </div>

    <div class="links-container">
        <a href="https://yourwebsite.com" class="link-card" target="_blank">Main Website</a>
        <a href="https://youtube.com" class="link-card" target="_blank">Latest Video</a>
        <a href="https://instagram.com" class="link-card" target="_blank">Instagram Portfolio</a>
    </div>

</body>
</html>
